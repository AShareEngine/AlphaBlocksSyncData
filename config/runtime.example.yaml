llm:
  provider_name: deepseek
  base_url: ''
  api_key: ''
  model_name: deepseek-chat
  temperature: 0.1
  max_tokens: 4096
  enabled: true
  verify_ssl: true

datasource:
  id: primary
  name: Primary Data Source
  db_type: clickhouse
  host: 127.0.0.1
  port: 8123
  database: starlight
  username: default
  password: ''
  secure: false
  extra_params: {}

discovery:
  allow_databases: []
  allow_tables: []
  trading_calendar_table: ''

runtime_state:
  database: alphablocks

sync:
  scheduler:
    # 不同供应商可并发；同一供应商内始终串行。
    max_parallel_providers: 3
  akshare:
    proxy: ''
    request_interval_seconds: 1.0
    retries: 2
    retry_backoff_seconds: 2.0
    default_start_date: '2010-01-01'
    adjust: ''
    common_stock_only: true
    include_pink: false
  amazingdata:
    username: YOUR_AMAZINGDATA_ACCOUNT
    password: YOUR_AMAZINGDATA_PASSWORD
    host: YOUR_AMAZINGDATA_HOST
    port: 8600
    local_path: /path/to/local_amazing_data
  baostock:
    user_id: anonymous
    password: 123456
  qmt:
    base_url: http://YOUR_QMT_HOST:8000
    api_key: YOUR_QMT_API_KEY
    timeout: 60
  tushare:
    token: YOUR_TUSHARE_TOKEN
    # 官方服务使用 https://api.tushare.pro；兼容代理可填写其根地址，
    # 例如 http://jiaoch.site。不要在末尾追加 /daily 等接口名。
    base_url: https://api.tushare.pro
    timeout: 60
    retries: 2
    retry_backoff_seconds: 2.0
    request_interval_seconds: 0.2
    default_start_date: '20100101'
    page_size: 5000
    # 0 表示不限制；设置正数可避免一次运行耗尽账号日配额。
    max_requests_per_run: 0
  yfinance:
    proxy: ''
    batch_size: 5
    threads: false
    auto_adjust: false
    repair: false
    timeout: 30
    network_retries: 2
    request_interval_seconds: 2.0
    rate_limit_retries: 4
    rate_limit_backoff_seconds: 30.0
    rate_limit_max_backoff_seconds: 300.0
    rate_limit_jitter_seconds: 3.0
    active_symbols_only: true
    symbol_directory_timeout: 60
    default_start_date: '2010-01-01'
    include_otc: false
