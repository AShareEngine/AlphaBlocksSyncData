# AmazingData 历史股票 1 分钟 K 线逐股票增量回补
#
# 规则：
# - 代码池来自 starlight.ad_hist_code_daily，包含股票、指数、ETF、ETF 期权、可转债。
# - 请求区间内出现过的历史证券都会进入增量回补。
# - 每只股票先查询 starlight.ad_market_kline_minute 的 max(trade_time)。
# - 没有数据的股票从 20100101 开始；已有数据的股票从最新日期下一天开始。
# - 请求结束日期留空，运行时自动使用最新交易日。

source = "amazingdata"
log_level = "INFO"
continue_on_error = true

[defaults]
begin_date = 20100101
limit = 0
force = false
resume = false
universe_mode = "historical"

[[tasks]]
task = "minute_kline"
enabled = true
